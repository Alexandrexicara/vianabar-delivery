<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurar acesso do comerciante</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;font:16px Arial,sans-serif;color:#182230;padding:20px}
main{width:min(100%,460px);background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 40px #18223018}
h1{font-size:24px;margin:0 0 8px}p{color:#667085;line-height:1.5}
label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#157347;color:white;font-weight:700;font-size:16px;margin-top:20px;cursor:pointer}
#message{margin-top:14px;color:#b42318;line-height:1.4}
</style>
</head>
<body><main>
<h1>Configurar acesso do comerciante</h1>
<p>Use esta página uma única vez para criar o primeiro administrador da loja. O código de configuração deve ser fornecido pelo responsável técnico e configurado no servidor.</p>
<form id="setup">
<label for="storeId">Código da loja</label><input id="storeId" required maxlength="120" autocomplete="organization">
<label for="email">E-mail administrativo</label><input id="email" type="email" required autocomplete="username">
<label for="password">Nova senha (mínimo 12 caracteres)</label><input id="password" type="password" minlength="12" required autocomplete="new-password">
<label for="token">Código de configuração</label><input id="token" type="password" required autocomplete="off">
<button type="submit">Criar acesso seguro</button>
</form><div id="message" role="status"></div>
</main>
<script>
if(location.hostname!=='vianabar-delivery.onrender.com'){location.replace('https://vianabar-delivery.onrender.com/merchant-setup.html'+location.search);}
document.getElementById('setup').addEventListener('submit',async function(event){
 event.preventDefault();const button=this.querySelector('button');const message=document.getElementById('message');
 button.disabled=true;button.textContent='Configurando...';message.textContent='';
 try{
  const response=await fetch('https://vianabar-delivery.onrender.com/api/merchant-auth/bootstrap',{
   method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Merchant-Setup-Token':document.getElementById('token').value},
   body:JSON.stringify({storeId:document.getElementById('storeId').value.trim(),email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})
  });
  const result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||'Não foi possível configurar.');
  message.style.color='#067647';message.textContent='Acesso criado. Redirecionando para o painel...';
  let data={};try{data=JSON.parse(localStorage.getItem('establishmentData')||'{}')}catch(_){}
  data.uniqueId=result.merchant.storeId;data.storeId=result.merchant.storeId;data.email=result.merchant.email;delete data.adminPassword;
  localStorage.setItem('establishmentData',JSON.stringify(data));window.location.href='https://vianabar-delivery.onrender.com/admin.html';
 }catch(error){message.textContent=error.message;button.disabled=false;button.textContent='Criar acesso seguro'}
});
</script></body></html>
