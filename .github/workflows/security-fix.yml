name: Corrigir vulnerabilidades npm
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Diagnóstico inicial
        run: npm audit --json > audit-before.json || true
      - name: Aplicar correções compatíveis
        run: npm audit fix || true
      - name: Auditoria depois das correções
        run: npm audit || true
      - name: Salvar lockfile corrigido
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Corrige vulnerabilidades nas dependências npm"
            git push origin main
          else
            echo "Nenhuma atualização compatível encontrada."
          fi
