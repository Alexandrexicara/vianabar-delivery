name: Verificar checkout do cardápio
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'usuario.html'
      - 'admin.html'
      - 'cozinha.html'
      - 'garcom.html'
      - 'balcao.html'
      - 'creator-woovi.html'
      - 'routes/**'
      - 'services/**'
      - 'migrations/**'
      - 'scripts/check-html-inline-scripts.js'
      - '.github/workflows/check-cardapio-payments.yml'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verificar módulos do backend
        run: |
          node --check server.js
          node --check routes/woovi.js
          node --check routes/cardapioOrders.js
          node --check routes/merchantSettings.js
          node --check services/wooviService.js
          node --check services/orderEvents.js
      - name: Verificar scripts HTML
        run: node scripts/check-html-inline-scripts.js
