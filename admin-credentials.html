<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar Woovi — Vianas Bar Delivery</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:Arial,sans-serif;color:#203047;padding:18px}
main{width:min(100%,520px);background:#fff;border-radius:16px;padding:26px;box-shadow:0 12px 35px #182b4518}
h1{font-size:24px;margin:0 0 8px}p{line-height:1.5;color:#53657a}
label{display:block;font-weight:600;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#087f5b;color:#fff;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.hidden{display:none!important}.msg{padding:12px;border-radius:8px;margin-top:14px;white-space:pre-wrap}.error{background:#fff0f0;color:#9d2020}.success{background:#e8f7ef;color:#14643a}
.small{font-size:13px;color:#66788a}
</style>
</head>
<body>
<main>
<h1>Conectar conta Woovi</h1>
<p>Entre com o e-mail e a senha cadastrados no Vianas Bar Delivery. Depois informe o AppID da sua conta Woovi. A credencial será criptografada no servidor.</p>
<section id="loginSection">
<label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Senha do Vianas Bar</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton">Entrar</button>
</section>
<section id="connectSection" class="hidden">
<p id="merchantInfo"></p>
<label for="appId">AppID Woovi</label><input id="appId" type="password" autocomplete="off" placeholder="Cole aqui o AppID da Woovi">
<p class="small">Não informe sua senha bancária. O AppID é a credencial de integração da API Woovi.</p>
<button id="connectButton">Validar e conectar Woovi</button>
<button id="logoutButton" type="button" style="background:#66788a">Sair</button>
</section>
<div id="message" aria-live="polite"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const tokenKey = 'merchantSessionToken';
function showMessage(text, ok=false) {
  $('message').className = 'msg ' + (ok ? 'success' : 'error');
  $('message').textContent = text;
}
async function api(path, options={}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      'Content-Type':'application/json',
      ...(localStorage.getItem(tokenKey) ? {Authorization:'Bearer '+localStorage.getItem(tokenKey)} : {}),
      ...(options.headers||{})
    }
  });
  const data = await response.json().catch(()=>({}));
  if (!response.ok || data.success === false) throw new Error(data.error || 'Falha na comunicação com o servidor.');
  return data;
}
async function loadMerchant() {
  try {
    const data = await api('/merchant/me');
    $('loginSection').classList.add('hidden');
    $('connectSection').classList.remove('hidden');
    $('merchantInfo').textContent = data.merchant.establishment_name + ' — cadastro ' + data.merchant.document_type + ' — situação: ' + data.merchant.status;
    $('message').textContent = '';
    $('message').className = '';
  } catch (_) {
    localStorage.removeItem(tokenKey);
    $('loginSection').classList.remove('hidden');
    $('connectSection').classList.add('hidden');
  }
}
$('loginButton').addEventListener('click', async () => {
  $('loginButton').disabled = true;
  try {
    const data = await api('/merchant/login', {method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});
    localStorage.setItem(tokenKey,data.token);
    await loadMerchant();
    showMessage('Login realizado. Agora conecte seu AppID Woovi.',true);
  } catch(e) { showMessage(e.message); }
  finally { $('loginButton').disabled = false; }
});
$('connectButton').addEventListener('click', async () => {
  $('connectButton').disabled = true;
  try {
    const data = await api('/merchant/me/woovi',{method:'POST',body:JSON.stringify({appId:$('appId').value.trim()})});
    $('appId').value = '';
    showMessage(data.message || 'Woovi conectada.',true);
    await loadMerchant();
  } catch(e) { showMessage(e.message); }
  finally { $('connectButton').disabled = false; }
});
$('logoutButton').addEventListener('click',()=>{localStorage.removeItem(tokenKey);$('connectSection').classList.add('hidden');$('loginSection').classList.remove('hidden');showMessage('Sessão encerrada.',true);});
loadMerchant();
</script>
</body>
</html>
