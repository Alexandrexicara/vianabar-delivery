<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credenciais Woovi - Admin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #3498db;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #27ae60;
        }
        .error {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Credenciais Woovi</h2>
        <form id="credenciaisForm">
            <div class="form-group">
                <label for="merchantId">Merchant ID</label>
                <input type="text" id="merchantId" placeholder="Informe o Merchant ID">
            </div>
            <div class="form-group">
                <label for="appId">App ID</label>
                <input type="text" id="appId" placeholder="Informe o App ID">
            </div>
            <div class="form-group">
                <label for="apiKey">API Key</label>
                <textarea id="apiKey" placeholder="Cole a API Key aqui"></textarea>
            </div>
            <button type="button" class="btn" id="saveCredentialsBtn">Salvar Credenciais</button>
            <div id="message" class="message"></div>
        </form>
    </div>

    <script>
        document.getElementById('saveCredentialsBtn').addEventListener('click', () => {
            const merchantId = document.getElementById('merchantId').value.trim();
            const appId = document.getElementById('appId').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const messageDiv = document.getElementById('message');

            if (!merchantId || !appId || !apiKey) {
                messageDiv.textContent = 'Todos os campos são obrigatórios.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }

            // Simulação de salvamento (pode ser enviado via fetch para backend)
            console.log('Credenciais salvas:', { merchantId, appId, apiKey });
            messageDiv.textContent = 'Credenciais salvas com sucesso!';
            messageDiv.className = 'message success';
            messageDiv.style.display = 'block';
        });
    </script>
</body>
</html>
